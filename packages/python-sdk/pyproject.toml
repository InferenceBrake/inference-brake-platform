[project]
name = "inferencebrake"
version = "0.3.0"
description = "Loop detection for AI agents. Detect and stop runaway reasoning loops before they burn your token budget."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "InferenceBrake", email = "inferencebrake.dev@proton.me" }]
keywords = ["ai", "agents", "llm", "loop-detection", "langchain", "crewai", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.1.0",
]

[project.urls]
Homepage = "https://inferencebrake.dev"
Repository = "https://github.com/InferenceBrake/inference-brake-platform"
Documentation = "https://inferencebrake.dev/docs"
Issues = "https://github.com/InferenceBrake/inference-brake-platform/issues"

[project.scripts]
inferencebrake = "inferencebrake.client:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inferencebrake"]
